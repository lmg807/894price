<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>팔구사 시세 계산기</title>
  <style>
    :root {
      font-family: 'Pretendard', 'Malgun Gothic', system-ui, sans-serif;
      color: #252525;
      background: #f7f7f5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .container { max-width: 1060px; margin: 0 auto; padding: 44px 20px 60px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -1.2px; }
    h2 { margin: 0; font-size: 19px; letter-spacing: -.5px; }
    .subtitle, .hint, .footer { color: #858585; }
    .subtitle { margin: 0; font-size: 14px; }
    .brand { color: #99713b; border: 1px solid #ddc8a5; border-radius: 999px; padding: 8px 13px; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; white-space: nowrap; }
    .card { background: #fff; border: 1px solid #eae9e5; border-radius: 16px; box-shadow: 0 6px 24px rgba(0,0,0,.035); }
    .price-card { padding: 28px; margin-bottom: 20px; }
    .field-label { display: block; margin-bottom: 14px; font-size: 15px; font-weight: 750; }
    .input-wrap { display: flex; align-items: center; gap: 14px; max-width: 480px; }
    input { min-width: 0; width: 100%; padding: 15px 17px; border: 1px solid #dedbd4; border-radius: 10px; background: #fff; color: #252525; font: inherit; font-size: 22px; font-weight: 750; font-variant-numeric: tabular-nums; outline: none; transition: border-color .15s, box-shadow .15s; }
    #price { border: 2px solid #c7a46a; font-size: 30px; }
    input:focus { border-color: #b58b4b; box-shadow: 0 0 0 3px rgba(181,139,75,.12); }
    .unit { font-weight: 750; white-space: nowrap; }
    .hint { margin: 13px 0 0; font-size: 12px; line-height: 1.7; }
    .tables { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; margin-bottom: 20px; }
    .table-card { padding: 24px 24px 12px; }
    .table-heading { display: flex; align-items: center; justify-content: space-between; padding-bottom: 18px; }
    .table-note { font-size: 11px; color: #a17c48; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th { padding: 12px 10px; background: #faf9f6; color: #858585; font-size: 12px; font-weight: 600; }
    td { padding: 15px 10px; border-bottom: 1px solid #f0efed; font-size: 14px; }
    tbody tr:last-child td { border-bottom: none; }
    th:first-child, td:first-child { text-align: left; }
    th:last-child, td:last-child { text-align: right; }
    td:last-child { font-size: 15px; font-weight: 750; }
    .price-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .price-fields .input-wrap { max-width: none; }
    .price-fields .field-label { margin-bottom: 12px; }
    #buy { border: 2px solid #dedbd4; font-size: 30px; }
    .footer { margin-top: 22px; font-size: 12px; line-height: 1.9; }
    @media (max-width: 720px) {
      .container { padding: 24px 14px 40px; }
      .header { margin-bottom: 20px; }
      h1 { font-size: 24px; }
      .brand { padding: 7px 9px; font-size: 9px; }
      .price-card { padding: 18px 14px; }
      .tables { grid-template-columns: 1fr; gap: 14px; }
      .price-fields { gap: 10px; }
      .price-fields .input-wrap { gap: 5px; }
      .price-fields input, #price, #buy { font-size: 18px; padding: 12px 9px; }
      .price-fields .unit { font-size: 12px; }
      .price-fields .field-label { font-size: 13px; }
      .table-card { padding: 20px 18px 10px; }
      .header { align-items: flex-start; }
      h1 { font-size: 21px; }
      .brand { flex-shrink: 0; }
    }
    @media (max-width: 360px) {
      .price-fields { gap: 7px; }
      .price-fields input, #price, #buy { font-size: 16px; padding: 11px 7px; }
      .price-fields .unit { font-size: 11px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>1981팔구사 시세표 계산기</h1>
      </div>
      <span class="brand">1981팔구사</span>
    </header>

    <section class="card price-card">
      <div class="price-fields">
        <div class="price-field">
          <label class="field-label" for="price">판매시세 (원 / 돈)</label>
          <div class="input-wrap">
            <input id="price" type="text" inputmode="numeric" value="700,000" autocomplete="off">
            <span class="unit">원</span>
          </div>
        </div>
        <div class="price-field">
          <label class="field-label" for="buy">매입시세 (원 / 돈)</label>
          <div class="input-wrap">
            <input id="buy" type="text" inputmode="numeric" value="686,000" autocomplete="off">
            <span class="unit">원</span>
          </div>
        </div>
      </div>
    </section>

    <div class="tables">
      <section class="card table-card">
        <div class="table-heading"><h2>주물금</h2><span class="table-note">판매 가격</span></div>
        <table><thead><tr><th scope="col">중량</th><th scope="col">판매 가격</th></tr></thead><tbody id="raw"></tbody></table>
      </section>
      <section class="card table-card">
        <div class="table-heading"><h2>골드바(GBK/UBS/클로버)</h2><span class="table-note">공임 포함</span></div>
        <table><thead><tr><th scope="col">중량</th><th scope="col">판매 가격</th></tr></thead><tbody id="bar"></tbody></table>
      </section>
    </div>

  </main>

  <script>
    'use strict';

    const weights = [
      ['반돈', 0.5], ['1돈', 1], ['2돈', 2], ['3돈', 3],
      ['5돈', 5], ['10돈', 10], ['100g', 26.666]
    ];

    const priceInput = document.getElementById('price');
    const buyInput = document.getElementById('buy');
    const rawTable = document.getElementById('raw');
    const barTable = document.getElementById('bar');

    const numeric = value => Number(String(value).replace(/[^\d]/g, '')) || 0;
    const roundUp1000 = value => Math.ceil((value - 1e-8) / 1000) * 1000;
    const formatWon = value => `${Math.round(value).toLocaleString('ko-KR')}원`;

    function renderPrices() {
      const pricePerDon = numeric(priceInput.value);
      const rows = weights.map(([name, weight]) => ({
        name,
        raw: roundUp1000(pricePerDon * weight),
        bar: roundUp1000((pricePerDon + 1500) * weight + (name === '100g' ? 30000 : 15000))
      }));

      rawTable.innerHTML = rows.map(row =>
        `<tr><td>${row.name}</td><td>${formatWon(row.raw)}</td></tr>`
      ).join('');
      barTable.innerHTML = rows.map(row =>
        `<tr><td>${row.name}</td><td>${formatWon(row.bar)}</td></tr>`
      ).join('');
    }

    priceInput.addEventListener('input', renderPrices);
    [priceInput, buyInput].forEach(input => {
      input.addEventListener('blur', () => {
        input.value = numeric(input.value).toLocaleString('ko-KR');
      });
    });

    renderPrices();
  </script>
</body>
</html>
